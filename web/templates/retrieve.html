<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SLAM_rice - Retrieve Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #dddddd;
        }
        .header .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header img {
            vertical-align: middle;
            width: 70px;
            height: 70px;
            border-radius: 10px;
            margin-right: 10px;
        }
        .header h1 {
            display: inline;
            font-size: 2.5em;
            margin: 0;
            color: #333;
            vertical-align: middle;
        }
        .header p {
            font-size: 1.2em;
            color: #666;
            margin-top: 10px;
        }
        .nav {
            display: flex; /* Use Flexbox */
            justify-content: center; /* Center align the links */
            background-color: #D2DAFF;
            padding: 10px; /* Add some padding */
        }

        .nav a {
            display: inline-block;
            color: #000;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            transition: background-color 0.3s ease;
            font-weight: bold;
            font-size: 1.1em;
            margin: 0 10px; /* Add some margin between links */
        }

        .nav a:hover {
            background-color: #ccc;
            color: black;
        }
        .content {
            padding: 40px 20px;
            max-width: 1200px;
            margin: auto;
        }
        .content h2 {
            text-align: center;
            margin: 20px auto;
            margin-top: 10px; /* Adjust the top margin */
            margin-bottom: 10px; /* Adjust the bottom margin */
        }
        .content p {
            text-align: center;
            margin: 20px auto;
            width: 80%;
            font-size: 1.2em;
            line-height: 1.6;
            color: #555;
        }
        .retrieve-form {
            text-align: center;
            margin: 20px auto;
        }
        .retrieve-form input[type="text"] {
            width: 300px;
            padding: 10px;
            font-size: 1em;
            margin-right: 10px;
        }
        .retrieve-form button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #FFC5C5;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .retrieve-form button:hover {
            background-color: #e6a6a6;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SLAM Logo">
        <h1>SLAM_rice</h1>
    </div>
    <p>A hybrid deep learning-based method for rice acylation site prediction</p>
</div>

<div class="nav">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('predict') }}">Predict</a>
    <a href="{{ url_for('retrieve') }}">Retrieve</a>
    <a href="{{ url_for('citation') }}">Citation</a>
    <a href="{{ url_for('contact_us') }}">Contact</a>
</div>

<div class="content">
    <h2>Retrieve Your Results</h2>
    <p>
        Enter your task ID to retrieve your results.
    </p>
    <div class="retrieve-form">
        <form action="{{ url_for('retrieve') }}" method="post">
            <input type="text" name="task_id" placeholder="Enter your task ID..." required>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>

</body>
</html>
